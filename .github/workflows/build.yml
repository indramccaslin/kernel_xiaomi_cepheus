name: Build cepheus kernel (KSUN + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: raystef66/kernel_xiaomi_cepheus
          ref: v2.02_KSUN
          fetch-depth: 1

      - name: Fetch submodules (KernelSU-Next + AnyKernel)
        run: |
          curl -L "https://codeload.github.com/KernelSU-Next/KernelSU-Next/tar.gz/00cb93e0bc8bf3ca3680c7e8a3d7cf11d0b59071" -o /tmp/ksun.tgz
          mkdir -p KernelSU-Next && tar xzf /tmp/ksun.tgz -C KernelSU-Next --strip-components=1
          curl -L "https://codeload.github.com/raystef66/AnyKernel/tar.gz/e13ad11daec64ff512c86622a93d2010902287f6" -o /tmp/ak.tgz
          mkdir -p AnyKernel3 && tar xzf /tmp/ak.tgz -C AnyKernel3 --strip-components=1
          ls -la KernelSU-Next | head
          ls -la AnyKernel3 | head

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget build-essential bc bison flex libssl-dev libelf-dev \
            libyaml-dev pkg-config \
            python3 zip unzip cpio ccache lld rsync \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      - name: Download Neutron Clang
        run: |
          mkdir -p "$HOME/tc/neutron-clang"
          cd "$HOME/tc/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Build kernel
        run: |
          export PATH="$HOME/tc/neutron-clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export LLVM=1
          export KBUILD_BUILD_USER="$(echo '${{ github.actor }}' | tr A-Z a-z)"
          export KBUILD_BUILD_HOST="github-actions"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/' scripts/dtc/Makefile
          sed -i 's#python2 $(srctree)/scripts/dtc/mkdtboimg.py#python3 $(srctree)/scripts/dtc/mkdtboimg.py#' scripts/Makefile.lib
          sed -i 's/xrange/range/g' scripts/dtc/mkdtboimg.py
          printf '\nKBUILD_CFLAGS += -Wno-error\nKBUILD_CFLAGS += -Wno-error=default-const-init-var-unsafe\nKBUILD_CFLAGS += -Wno-default-const-init-var-unsafe\n' >> Makefile
          make O=out ARCH=arm64 cepheus_defconfig
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang AR=llvm-ar LD=ld.lld NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          ls -l out/arch/arm64/boot/
          rm -rf AnyKernel3/.git*
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 "../InfiniR-cepheus-KSUN-$(date +%Y%m%d).zip" . -x "README*" "*.zip" ".git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-ksun-kernel
          path: InfiniR-cepheus-KSUN-*.zip
          if-no-files-found: error
